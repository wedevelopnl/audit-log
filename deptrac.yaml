deptrac:
    paths:
        - ./src
    layers:
        - name: Event
          collectors:
            - { type: directory, value: src/Event/.* }
        - name: Recording
          collectors:
            - { type: directory, value: src/Recording/.* }
        - name: Record
          collectors:
            - { type: directory, value: src/Record/.* }
        - name: Reading
          collectors:
            - { type: directory, value: src/Reading/.* }
        - name: InfraDoctrine
          collectors:
            - { type: directory, value: src/Infrastructure/Doctrine/.* }
        - name: InfraSymfony
          collectors:
            - { type: directory, value: src/Infrastructure/Symfony/.* }
        - name: Bundle
          collectors:
            - { type: directory, value: src/DependencyInjection/.* }
            - { type: classNameRegex, value: /AuditLogBundle$/ }
    ruleset:
        Event: ~
        Record:
            - Event
        Recording:
            - Event
        Reading:
            - Event
            - Record
        InfraDoctrine:
            - Event
            - Recording
            - Record
            - Reading
        InfraSymfony:
            - Event
            - Recording
            - Record
            - Reading
        Bundle:
            - Event
            - Recording
            - Record
            - Reading
            - InfraDoctrine
            - InfraSymfony
