deptrac:
    paths:
        - ./src
    layers:
        - name: Event
          collectors:
            - { type: directory, value: src/Event/.* }
        - name: Recording
          collectors:
            - { type: directory, value: src/Recording/.* }
        - name: Record
          collectors:
            - { type: directory, value: src/Record/.* }
        - name: Reading
          collectors:
            - { type: directory, value: src/Reading/.* }
        - name: InfraDoctrine
          collectors:
            - { type: directory, value: src/Infrastructure/Doctrine/.* }
        - name: InfraSymfony
          collectors:
            - { type: directory, value: src/Infrastructure/Symfony/.* }
        - name: Bundle
          collectors:
            - { type: directory, value: src/DependencyInjection/.* }
            - { type: classNameRegex, value: /AuditLogBundle$/ }
        # Vendor framework layers exist solely to make "core is framework-free"
        # and "adapters are framework-isolated" enforceable: by covering these
        # namespaces, a forbidden core->framework dependency becomes a violation
        # rather than a silently-uncovered one. PSR contracts stay uncovered (and
        # thus allowed) by design — the core may depend on them (see ADR 0009).
        - name: SymfonyVendor
          collectors:
            - { type: classNameRegex, value: '/^Symfony\\/' }
        - name: DoctrineVendor
          collectors:
            - { type: classNameRegex, value: '/^Doctrine\\/' }
    ruleset:
        Event: ~
        Record:
            - Event
        Recording:
            - Event
        Reading:
            - Event
            - Record
        InfraDoctrine:
            - Event
            - Recording
            - Record
            - Reading
            - DoctrineVendor
        InfraSymfony:
            - Event
            - Recording
            - Record
            - Reading
            - SymfonyVendor
        Bundle:
            - Event
            - Recording
            - Record
            - Reading
            - InfraDoctrine
            - InfraSymfony
            - SymfonyVendor
        SymfonyVendor: ~
        DoctrineVendor: ~
